name: Release

# Fully automated: merging to main auto-bumps version, publishes to npm,
# and creates a GitHub Release.
#
# Version bump is determined by commit messages (conventional commits):
#   fix: …           → patch  (1.0.15 → 1.0.16)
#   feat: …          → minor  (1.0.15 → 1.1.0)
#   feat!: … / BREAKING CHANGE  → major  (1.0.15 → 2.0.0)
#   chore/docs/test/… → patch (default)

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for commit analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check if already published
        id: published
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view eslint-plugin-tailwind-v4 versions --json 2>/dev/null || echo "[]")
          if echo "$PUBLISHED" | grep -q "\"${CURRENT}\""; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v${CURRENT} is already on npm — skipping bump"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump
        if: steps.published.outputs.already != 'true'
        id: bump
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          # Filter out release commits
          COMMITS=$(echo "$COMMITS" | grep -v "^chore(release):" || true)

          # Skip if no meaningful commits since last tag
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^feat(\(.*\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.*\))?:"; then
            BUMP="minor"
          fi

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Determined bump: $BUMP"

      - name: Bump version
        if: steps.published.outputs.already != 'true' && steps.bump.outputs.skip != 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Calculate the expected new version and clean up stale tags
          BUMP_TYPE="${{ steps.bump.outputs.type }}"
          CURRENT=$(node -p "require('./package.json').version")
          NEXT=$(node -e "
            const [M,m,p] = '${CURRENT}'.split('.').map(Number);
            if ('${BUMP_TYPE}'==='major') console.log(M+1+'.0.0');
            else if ('${BUMP_TYPE}'==='minor') console.log(M+'.'+(m+1)+'.0');
            else console.log(M+'.'+m+'.'+(p+1));
          ")
          # Remove stale local tag if it exists (from a previous failed run)
          git tag -d "v${NEXT}" 2>/dev/null || true

          NEW_VERSION=$(npm version $BUMP_TYPE -m "chore(release): v%s")
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Push version commit and tag
        if: steps.published.outputs.already != 'true' && steps.bump.outputs.skip != 'true'
        run: |
          git push
          git push --tags

      - name: Publish to npm
        if: steps.published.outputs.already != 'true' && steps.bump.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.published.outputs.already != 'true' && steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
