name: Release

# Fully automated: merging to main auto-bumps version, publishes to npm,
# and creates a GitHub Release.
#
# Version bump is determined by commit messages (conventional commits):
#   fix: …           → patch  (1.0.15 → 1.0.16)
#   feat: …          → minor  (1.0.15 → 1.1.0)
#   feat!: … / BREAKING CHANGE  → major  (1.0.15 → 2.0.0)
#   chore/docs/test/… → patch (default)

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  id-token: write   # Required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for commit analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check publish status
        id: status
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view eslint-plugin-tailwind-v4 versions --json 2>/dev/null || echo "[]")
          if echo "$PUBLISHED" | grep -q "\"${CURRENT}\""; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            echo "v${CURRENT} already on npm — nothing to do"
          else
            # Version in package.json is NOT on npm — check if it was already bumped
            # (re-run after publish failure) or needs a new bump
            TAG_EXISTS=$(git tag -l "v${CURRENT}")
            if [ -n "$TAG_EXISTS" ]; then
              echo "state=publish-only" >> "$GITHUB_OUTPUT"
              echo "v${CURRENT} bumped but not published — will publish only"
              echo "tag=v${CURRENT}" >> "$GITHUB_OUTPUT"
            else
              echo "state=needs-bump" >> "$GITHUB_OUTPUT"
              echo "Needs version bump + publish"
            fi
          fi

      # ── Path A: Version already bumped, just publish ──────────────
      - name: Publish unpublished version
        if: steps.status.outputs.state == 'publish-only'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (re-run)
        if: steps.status.outputs.state == 'publish-only'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.status.outputs.tag }}
          generate_release_notes: true

      # ── Path B: Full bump → push → publish flow ───────────────────
      - name: Determine version bump
        if: steps.status.outputs.state == 'needs-bump'
        id: bump
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          # Filter out release commits
          COMMITS=$(echo "$COMMITS" | grep -v "^chore(release):" || true)

          # Skip if no meaningful commits since last tag
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^feat(\(.*\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.*\))?:"; then
            BUMP="minor"
          fi

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Determined bump: $BUMP"

      - name: Bump version
        if: steps.status.outputs.state == 'needs-bump' && steps.bump.outputs.skip != 'true'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest to avoid non-fast-forward errors
          git pull --rebase origin main

          # Clean up stale tags
          BUMP_TYPE="${{ steps.bump.outputs.type }}"
          CURRENT=$(node -p "require('./package.json').version")
          NEXT=$(node -e "
            const [M,m,p] = '${CURRENT}'.split('.').map(Number);
            if ('${BUMP_TYPE}'==='major') console.log(M+1+'.0.0');
            else if ('${BUMP_TYPE}'==='minor') console.log(M+'.'+(m+1)+'.0');
            else console.log(M+'.'+m+'.'+(p+1));
          ")
          git tag -d "v${NEXT}" 2>/dev/null || true

          NEW_VERSION=$(npm version $BUMP_TYPE -m "chore(release): v%s")
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Push version commit and tag
        if: steps.status.outputs.state == 'needs-bump' && steps.bump.outputs.skip != 'true'
        run: |
          git push
          git push --tags

      - name: Publish to npm
        if: steps.status.outputs.state == 'needs-bump' && steps.bump.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.status.outputs.state == 'needs-bump' && steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
